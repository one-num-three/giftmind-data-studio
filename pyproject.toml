[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "giftmind-data-studio"
version = "0.1.0"
description = "GiftMind data collection and maintenance studio"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14",
    "aiosqlite>=0.20",
    "fastapi>=0.115",
    "itsdangerous>=2.2",
    "httpx>=0.28",
    "openpyxl>=3.1",
    "python-multipart>=0.0.20",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28",
    "pytest>=8.3",
    "pytest-asyncio>=0.26",
]
ocr = [
    "paddleocr>=3.3",
    "paddlepaddle>=3.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["backend*"]
